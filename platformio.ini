; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 38400
lib_deps = 
   ArduinoJson@7.4.3 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/ArduinoJson
   AsyncTCP@3.6.1 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/Async_TCP
   ElegantOTA@4.0.0 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/ElegantOTA
   ESPAsyncWebServer@3.12.1 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/ESP_Async_WebServer 
   NMEA0183@1.10.1 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/NMEA0183-master  
   NMEA2000_CAN@4.24.1 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/NMEA2000-master

[espressif32_base]
platform = espressif32
board_build.partitions = min_spiffs.csv

[env:esp32dev]
extends = espressif32_base
board = esp32dev
build_flags = 
   -DARDUINO_ESP32_DEV
lib_deps = 
   ${env.lib_deps}
   NMEA2000_esp32@1.0.3 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/NMEA2000_esp32-master

[env:upesy_wroom]
extends = espressif32_base
board = upesy_wroom
build_flags = 
   -DARDUINO_UPESY_WROOM
lib_deps = 
   ${env.lib_deps}
   NMEA2000_esp32@1.0.3 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/NMEA2000_esp32-master

[env:esp32-s3-devkitc-1]
extends = espressif32_base
board = esp32-s3-devkitc-1
build_flags = 
    -DARDUINO_ESP32S3_DEV 
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.prsam_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps = 
   ${env.lib_deps}
   NMEA2000_esp32@1.0.3 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/NMEA2000_esp32_twai

[env:esp32-c3-devkitm-1]
extends = espressif32_base
board = esp32-c3-devkitm-1
build_flags = 
    -DARDUINO_ESP32C3_DEV
lib_deps = 
   ${env.lib_deps}
   NMEA2000_esp32@1.0.3 = symlink://${sysenv.USERPROFILE}/SynologyDrive/Programs/Arduino/libraries/NMEA2000_esp32_twai
