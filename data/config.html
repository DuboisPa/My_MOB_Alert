<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN"
         "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
   <meta http-equiv="content-type" content="text/html; charset=utf-8">
   <title>ESP32 My Moby Alert parameters</title>
   <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
   <meta http-equiv="Pragma" content="no-cache">
   <meta http-equiv="Expires" content="0">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
   <!--link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"-->

<style>
.h1 {
  font-style: normal;
  text-transform: none;
  font-weight: bold;
  margin-left: auto;
  margin-right: auto;
  font-size: 20pt;
  text-align: center;
}
.hostname {
  margin: 20px;
  width: 96%;
  border-color: #0f458d;
  font-size: 110%;
  text-align: center;
}
.network {
  float: left;
  width: 49.8%;
  font-size: 100%;
}
.field_network {
  border-color: #0f458d;
  margin: 20px;
  padding: 1em;
  height: 180px;
}
.field_GNSS_MOB {
  //width : 96%;
  border-color: #0f458d;
  margin: 20px;
  padding: 1em;
  height: 140px;
}
.wificlients {
  margin-left: 31%;
  margin-right: 2%;
  width: 8%;
  font-size: 90%;
  text-align: center;
}
.GNSS_MOB_others {
  float: left;
  width: 33.2%; // 50%
  font-size: 100%;
}
.ext_choices {
  text-align: justify;
}
.nmeainput{
  width: 140px;
  margin-right: 0.5%;
  font-size: 90%;
  text-align: left;
  background-color: Gainsboro;
}
.nmeaoutput{
  width: 140px;
  margin-right: 0.5%;
  font-size: 90%;
  text-align: left;
  background-color: Gainsboro;
}
.nmeachoices {
  font-size: 100%;
  text-align: justify;
}
.nmeatimeout{
  width: 10%;
  margin-right: 1%;
  font-size: 90%;
  text-align: left;
  border: 2px solid gray;
  border-radius: 8px;
  padding: 4px;
}
.valuesButtons {
   width: 360pt;
   //width: 250pt;
   text-align: center;  
   //margin-left: 5%;
   margin-right: 1.5%;  
   //float: left;
   float: right;   
}
.lbuttons {
   width : 100pt;
   height : 30px;
   margin-left: 5pt;
   margin-right:5pt;   
}
.nmealeft {
   float : left;
   width : 46.5%;
   border-color: #0f458d;
   margin: 10px;
}
.nmearight {
   float : right;
   width : 46.5%;
   border-color: #0f458d;
   margin: 10px;
}
.inp {
   border: 1px solid #0f458d;
   width: 55%;
   font-size: 100%;
   text-align: center;
   margin-right : 10px;
}
.grid-container {
   display: grid; 
   grid-template-columns: auto auto;
   //grid-template-columns: 150px 350px 150px 350px 150px 350px;
   //grid-template-columns: fit-content(160px) 350px fit-content(150px) 350px auto;
   //column-gap: 10px;
   row-gap: 10px;
   //padding: 5px;
   //gap: 5px;
}
.grid-container > div {
  // width: 100%;
  // margin-right: 0.5%;
  // font-size: 90%;
  //border: 1px solid black;
  //margin:10px;
  //padding: 10px;
  text-align: left;
}
</style>

</head>

<body>

<div class="h1">
   <span>ESP32 My MOB Alert parameters</span>
</div>
<br>
<form method="post" name="configsettings" id="configSettings">
   <div >
      <fieldset class="hostname">
         <label for="APSTAHostName">Host Name</label>
         <input style="width:18%; font-size:100%; border:1px solid #0f458d; margin-left:10px;" id="APSTAHostName" name="apstahostname" value="My_MOB_Alert" type="text" minlength="1" maxlength="32">
      </fieldset>
   </div>
   
   <div class="network">
      <fieldset class="field_network"><legend>WI-FI AP NETWORK</legend> 
         <div class="ext_choices">
            <input id="APmode" name="apmode" checked="checked" type="checkbox" onclick="changeAPfields(id)"> 
            <label for="APmode"> USE Autonomous</label>
            <select class="wificlients" id="APClients" name="apclients">
               <option value="4" selected>4</option>
               <option value="5">5</option>
               <option value="6">6</option>
               <option value="7">7</option>
               <option value="8">8</option>
            </select>Number of clients
         </div>
         <br>
         <input class="inp" id="APPassword" name="appassword" value="xxxxxxxx" type="password" minlength="8" maxlength="64">
         <i class="far fa-eye" id="TogglePassAP" style="cursor: pointer; margin-left: -23px;"></i>
         <label for="APPassword"> PASSWORD</label><br>
         <input class="inp" id="APlocalIP" name="aplocalip" type="text" placeholder="192.168.4.1" onblur="ValidateIPaddress(id)">
         <label for="APlocalIP"> IP ADDRESS</label>
         <input class="inp" id="APsubnetMaskIP" name="apsubnetmaskip" type="text" placeholder="255.255.255.0" onblur="ValidateIPaddress(id)">
         <label for="APsubnetMaskIP"> SUBNET MASK</label>
         <input class="inp" id="APgatewayIP" name="apgatewayip" type="text" placeholder="192.168.4.99" onblur="ValidateIPaddress(id)">
         <label for="APgatewayIP"> GATEWAY</label>
         <input class="inp" id="APdhcp_startIP" name="apdhcp_startip" type="text" placeholder="192.168.4.11" onblur="ValidateIPaddress(id)">
         <label for="APdhcp_startIP"> DHCP Start</label>
      </fieldset>
   </div>
   <div class="network">
      <fieldset class="field_network"><legend>EXTERNAL NETWORK</legend>
         <div class="ext_choices"> 
            <input id="STAmode" name="stamode" type="checkbox" checked="checked" onclick="changeSTAfields(id)"> 
            <label for="STAmode"> USE External</label>
            <input id="DHCP" name="dhcpstatic" type="radio" checked onclick="changeStaticfields()"> 
            <label for="DHCP"> DHCP</label> 
            <input id="Static" name="dhcpstatic" type="radio" onclick="changeStaticfields()">
            <label for="Static"> STATIC</label> 
         </div>
         <br>
         <input class="inp" id="STASSID" name="stassid" value="xxxxxxxx" type="text" minlength="1" maxlength="32">
         <label for="STASSID"> SSID</label><br>
         <input class="inp" id="STAPassword" name="stapassword" value="xxxxxxxx" type="password" minlength="8" maxlength="64">
         <i class="far fa-eye" id="TogglePassSTA" style="cursor: pointer; margin-left: -23px;"></i> 
         <label for="STAPassword"> PASSWORD</label><br>
         <input class="inp" id="STAlocalIP" name="stalocalip" type="text" placeholder="192.168.1.32" onblur="ValidateIPaddress(id)" disabled>
         <label for="STAlocalIP"> IP ADDRESS</label>
         <input class="inp" id="STAsubnetMaskIP" name="stasubnetmaskip" type="text" placeholder="255.255.255.0" onblur="ValidateIPaddress(id)" disabled>
         <label for="STAsubnetMaskIP"> SUBNET MASK</label>
         <input class="inp" id="STAgatewayIP" name="stagatewayip" type="text" placeholder="192.168.1.254" onblur="ValidateIPaddress(id)" disabled>
         <label for="STAgatewayIP"> GATEWAY</label>
      </fieldset>
   </div>
   
   <div class="GNSS_MOB_others">
      <fieldset class="field_GNSS_MOB"><legend>GNSS input</legend> 
         <div class="grid-container">
            <div>    
               <input name="gnssinput" id="G_Serial" type="radio" checked onchange="EnableSelect(id)"> 
               <label for="G_Serial"> Nmea0183 Serial & Baudrate</label> 
            </div>
            <div>
               <select class="nmeainput" id="G_SerialB" name="g_serialb">
                  <option value="4800">4800</option>
                  <option value="9600">9600</option>
                  <option value="19200">19200</option>
                  <option value="38400" selected>38400</option>
                  <option value="57600">57600</option>
                  <option value="115200">115200</option>
                  </select>
            </div>
            <div>
               <input name="gnssinput" id="G_Udp" type="radio" onchange="EnableSelect(id)">
               <label for="G_Udp"> Nmea0183 UDP & Port</label> 
            </div>
            <div>
               <input class="nmeainput" style="width:132px" type="number" id="G_Port" name="g_port" min="1025" max="49151" step="1" value="2010" onchange="AlertUDP_ports()" disabled>
            </div>
            <div>      
               <input name="gnssinput" id="G_N2K" type="radio" onchange="EnableSelect(id)" onclick="WarningMsg()" >
               <!--label for="G_N2K"> Nmea2000 & PGN</label--> 
               <label for="G_N2K"> Nmea2000</label> 
            </div> 
            <div>
               <select class="nmeainput" id="G_Pgn" name="g_pgn" disabled hidden>
                  <option value="129029" selected>129029</option>
                  <option value="129026">129026, 129029</option>
                  <option value="129025">129025, 129033</option>
                </select>
            </div> 
            <div>      
               <label for="G_TimeOut"> GNSS Validity TimeOut (seconds)</label> 
            </div>
            <div>
               <input class="nmeainput" type="number" style="width:132px; text-align:right" id="G_TimeOut" name="g_timeout"  min="5" max="60" step="1" value="15" onchange="AlertTimeOut(id)">
            </div> 
         </div>
      </fieldset>
   </div>

   <div class="GNSS_MOB_others">
      <fieldset class="field_GNSS_MOB"><legend>MOB-AIS Settings</legend>
         <div class="grid-container">
            <div>
               <label for="MMSI_number">M.M.S.I.</label>
            </div>
            <div>
               <input class="nmeaoutput" style="width:72px" id="MMSI_number" name="mmsi_number" type="text" placeholder="972990001" minlength="9" maxlength="9" size="9" pattern="[0-9]{9}" title="Only 9 digits" required onchange="ValidateMMSI(id)">
            </div>
            <div>
               <label for="AIS_MOB">AIS MOB</label>
            </div>
            <div>
               <input class="nmeaoutput" id="AIS_MOB" name="ais_mob" type="checkbox" onclick="AlertAISMOB(id)" checked>
            </div>
            <div>
               <label for="WPL_MOB">WPL MOB</label>
            </div>
            <div>
               <input class="nmeaoutput" style="align:left" id="WPL_MOB" name="wpl_mob" type="checkbox" onclick="AlertAISMOB(id)" checked>
            </div>
            <div>
               <label for="R_Message">Repeat message</label>
            </div>
            <div>
               <input class="nmeaoutput" style="width:72px; text-align:right" type="number" id="R_Message" name="r_message" min="1" max="5" step="1" value="1" onchange="AlertRepeatMessage(id)">
            </div>
         </div>
      </fieldset> 
   </div>  
   
   <div class="GNSS_MOB_others">
      <fieldset class="field_GNSS_MOB" onchange="checkoutput()"><legend>MOB-AIS output</legend>
         <div class="grid-container">
            <div>    
               <input id="M_SerialU" name="m_serialu" type="checkbox" onchange="EnableSelect(id)"> 
               <label for="M_SerialU"> Nmea0183 USB & Baudrate</label> 
            </div>
            <div>
               <select class="nmeaoutput" id="M_SerialUB" name="m_serialub" disabled>
                  <option value="4800">4800</option>
                  <option value="9600">9600</option>
                  <option value="19200">19200</option>
                  <option value="38400" selected>38400</option>
                  <option value="57600">57600</option>
                  <option value="115200">115200</option>
               </select>
            </div>
            <div>    
               <input id="M_Serial" name="m_serial" type="checkbox" checked onchange="EnableSelect(id)"> 
               <label for="M_Serial"> Nmea0183 Serial & Baudrate</label> 
            </div>
            <div>
               <select class="nmeaoutput" id="M_SerialB" name="m_serialb">
                  <option value="4800">4800</option>
                  <option value="9600">9600</option>
                  <option value="19200">19200</option>
                  <option value="38400" selected>38400</option>
                  <option value="57600">57600</option>
                  <option value="115200">115200</option>
                  </select>
            </div>
            <div>
            <input id="M_Udp" name="m_udp"type="checkbox" onchange="EnableSelect(id)">
               <label for="M_Udp"> Nmea0183 UDP & Port</label> 
            </div>
            <div>
               <input class="nmeaoutput" style="width:132px" type="number" id="M_Port" name="m_port" min="1025" max="49151" step="1" value="10110" onchange="AlertUDP_ports()" disabled>
            </div>
            <div>      
               <input id="M_N2K" name="m_n2k" type="checkbox" disabled>
               <label for="M_N2K"> Nmea2000</label> 
            </div>
            <div>      
               <select class="nmeainput" id="M_Pgn" name="m_pgn" hidden>
                  <option value="127233">127233</option>
               </select>
            </div>
         </div>   
      </fieldset>
   </div>
</form>

<div class="valuesButtons">
   <fieldset>
      <button type="button" class="lbuttons" name="loadc" id="LoadC"  onclick="loadConfig()">LOAD</button>
      <button type="button" class="lbuttons" name="resetc" id="ResetC" onclick="resetConfig()">RESET</button>
      <button type="button" class="lbuttons" name="savec" id="SaveC" onclick="saveConfig()">SAVE & RESTART</button>
   </fieldset>
</div>
   
<script type="text/javascript">

var bToggleAP;
var bToggleSTA;

document.addEventListener("DOMContentLoaded", () => {
  loadConfig();
});

function loadConfig() {
   fetch('/loadConfig')
   .then(response => response.json()) // Convertit en JSON
   .then(data => {
      //console.log("JSON reçu :", data);
      //alert("JSON reçu :", data);
      //jsonValues = JSON.stringify(data);   // no, you're an idiot, you're adding single quotes around valid JSON!
      var jsonValues = data;
      //document.getElementById("jsonOutput").innerHTML = `${jsonValues}`; // warning : backtip or grave accent U+0060  // to control 
      resetConfig(jsonValues);
   })
   .catch(error => console.error("Erreur JSON :", error));
}

function resetConfig(jsonValues) {
   if (jsonValues === undefined) {
      var jsonFieldsValues = {"APSTAHostName":"My_MOB_Alert","APmode":true,"APClients":"4","APPassword":"12345678","APlocalIP":"192.168.4.1","APsubnetMaskIP":"255.255.255.0","APgatewayIP":"192.168.4.99","APdhcp_startIP":"192.168.4.11","STAmode":false,"DHCP":true,"Static":false,"STASSID":"SSID_to_change","STAPassword":"Password_to_change","STAlocalIP":"192.168.1.64","STAsubnetMaskIP":"255.255.255.0","STAgatewayIP":"192.168.1.254","G_Serial":true,"G_SerialB":38400,"G_Udp":false,"G_Port":2010,"G_N2K":false,"G_Pgn":129029,"G_TimeOut":15,"MMSI_number":972990001,"AIS_MOB":false,"WPL_MOB":true,"R_Message":1,"M_SerialU":false,"M_SerialUB":38400,"M_Serial":true,"M_SerialB":38400,"M_Udp":false,"M_Port":10110,"M_N2K":false,"M_Pgn":127233};
   }
   else {
      var jsonFieldsValues = jsonValues;
   }
   for (obj of Object.entries(jsonFieldsValues)) {
      let element = document.getElementById(obj[0]);
      if (["checkbox","radio"].includes(element.type)) {
         element.checked = obj[1];
      }
      else {
         element.value = obj[1];
      }
   }
   changeAPfields("APmode");
   changeSTAfields("STAmode");
   let arrayofID = ["G_Serial","G_Udp","G_N2K","M_SerialU","M_Serial","M_Udp"];
   for (let xId of arrayofID) { EnableSelect(xId)};
}

function saveConfig() {
   let form = document.getElementById("configSettings");
   let formData = {};
   for (let i = 0; i < form.elements.length; i++) {
      let element = form.elements[i];
      if (["checkbox","radio"].includes(element.type)) {
         formData[element.id] = element.checked;
      }
      else { 
         formData[element.id] = element.value;
      }
   }
   sendConfig(JSON.stringify(formData));
}

function sendConfig(jsonData) {
   // Envoyer les données via fetch() (AJAX)
   fetch('/saveConfig', {
      method: 'POST',
      headers: {
         'Content-Type': 'application/json',
      },
      body: jsonData // Envoyer les données JSON
   })    // fetch
   .then(response => response.text())
   .then(data => {
     //alert('Données envoyées avec succès !');
   }) // then(data
   .catch(error => {
      //alert('Erreur lors de l\'envoi des données.');
   })   // catch 
}

function checkoutput() {
   if (!document.getElementById("M_SerialU").checked
      && !document.getElementById("M_Serial").checked
      && !document.getElementById("M_Udp").checked
      && !document.getElementById("M_N2K").checked) {
         alert("One of the MOB-AIS outputs must be enabled !\n\nNmea0183 Serial output selected");
         document.getElementById("M_Serial").checked = true;
         document.getElementById("M_SerialB").disabled = false;
      }
}

function EnableSelect(id) {
   let bX = document.getElementById(id).checked;
   switch (id) {
      case "G_Serial":  {  document.getElementById("G_SerialB").disabled = !bX;
                           document.getElementById("G_Port").disabled = bX;
                           document.getElementById("G_Pgn").disabled = bX;
                        }
                        break;
      case "G_Udp"   :  {  document.getElementById("G_SerialB").disabled = bX;
                           document.getElementById("G_Port").disabled = !bX;
                           document.getElementById("G_Pgn").disabled = bX;
                        }
                        break;
      case "G_N2K"   :  {  document.getElementById("G_SerialB").disabled = bX;
                           document.getElementById("G_Port").disabled = bX;
                           document.getElementById("G_Pgn").disabled = !bX;
                        }
                        break;
      case "M_SerialU"  :  document.getElementById("M_SerialUB").disabled = !bX; break;
      case "M_Serial"   :  document.getElementById("M_SerialB").disabled = !bX; break;
      case "M_Udp"      :  document.getElementById("M_Port").disabled = !bX; break;
   }
}

function AlertTimeOut(id) {
   let timeout = document.getElementById(id).value;
   if (timeout < 5 || timeout > 60) {
      alert("TimeOut must be from 5 to 60");
      document.getElementById(id).value = 15;
   }
}

function AlertRepeatMessage(id) {
   let repeat = document.getElementById(id).value;
   if (repeat < 1 || repeat > 5) {
      alert("Repeat must be from 1 to 5");
      document.getElementById(id).value = 1;
   }
}

function AlertAISMOB(id) {
   let bA = document.getElementById("AISVDM").checked;
   let bM = document.getElementById("WPL_MOB").checked;
   if (!bA && !bM) {
      alert("At least one message type !");
      document.getElementById(id).checked = true;
   }
}

function AlertUDP_ports() {
   let G = document.getElementById("G_Port").value;
   let M = document.getElementById("M_Port").value;
   if (G == M) {
      alert("UDP ports cannot have the same number\nif both are used");
   }
}

function WarningMsg() {
   //alert ("Not yet implemented,\njust to show the different PGN\nsent by GNSS on NM2K");
   alert ("Not yet implemented");
}

function changeAPfields(id) {
   if (AlertAPSTAStatus(id)) {
      // warning, inverse the value
      let bX = document.getElementById(id).checked;
      let togglePass = document.getElementById("TogglePassAP");
      if (bToggleAP && !bX) {
         togglePass.click();
      }
      togglePass.style = bX ? "cursor: pointer; margin-left: -23px;" : "cursor: pointer; margin-left: -21px; visibility: hidden";
      document.getElementById("APClients").disabled = !bX;
      document.getElementById("APPassword").disabled = !bX;
      document.getElementById("APlocalIP").disabled = !bX;
      document.getElementById("APsubnetMaskIP").disabled = !bX;
      document.getElementById("APgatewayIP").disabled = !bX;
      document.getElementById("APdhcp_startIP").disabled = !bX;
   }
}

function changeSTAfields(id) {
   if (AlertAPSTAStatus(id)) {
      // warning, inverse the value
      let bX = document.getElementById(id).checked;
      let togglePass = document.getElementById("TogglePassSTA");
      if (bToggleSTA && !bX) {
         togglePass.click();
      }
      togglePass.style = bX ? "cursor: pointer; margin-left: -23px;" : "cursor: pointer; margin-left: -21px; visibility: hidden";
      document.getElementById("STASSID").disabled = !bX;
      document.getElementById("STAPassword").disabled = !bX;
      document.getElementById("DHCP").disabled = !bX;
      document.getElementById("Static").disabled = !bX;
      changeStaticfields();
   }
}

function changeStaticfields() {
   // warning, inverse the value
   let bX = document.getElementById("DHCP").checked;
   document.getElementById("STAlocalIP").disabled = bX;
   document.getElementById("STAsubnetMaskIP").disabled = bX;
   document.getElementById("STAgatewayIP").disabled = bX;
}

function AlertAPSTAStatus(id) {
   let bAP = document.getElementById("APmode").checked;
   let bSTA = document.getElementById("STAmode").checked;
   let bOK = true;
   if (!bAP && !bSTA) {
      alert("One of the networks must be enabled !");
      document.getElementById(id).checked = true;
      bOK = false;
   }
   return bOK;
}

function ValidateMMSI(id) {
   let MMSI_MID = ["970", "972", "974"];
   let sValue = document.getElementById(id).value;
   if (! MMSI_MID.includes(sValue.substr(0,3))) {
      alert ("M.M.S.I. must start by 970, 972 or 974");
   }
   else if (sValue.length != 9) {
      alert ("9 digits mandatory\n99 is advised following 97x");
   }
}

function ValidateIPaddress(id) {
   let vValue = document.getElementById(id).value;
   let bOK = false;
   if (/^(?!.*\.$)((?!0\d)(1?\d?\d|25[0-5]|2[0-4]\d)(\.|$)){4}$/.test(vValue)){
      bOK = true;
   }
   else {
      alert("IP address is invalid !");
   }
   return bOK;
}

// AP Password
const togglePassAP = document.getElementById("TogglePassAP");
togglePassAP.addEventListener("click", function() {
      const passwordAP = document.getElementById("APPassword"); 
      let type = passwordAP.getAttribute("type") === "password" ? "text" : "password";
      passwordAP.setAttribute("type", type);
      bToggleAP = type === "text" ? true : false;
      this.classList.toggle("fa-eye-slash");
   } 
);

// STA Password
const togglePassSTA = document.getElementById("TogglePassSTA");
togglePassSTA.addEventListener("click", function() {
      const passwordSTA = document.getElementById("STAPassword");
      // toggle the type attribut
      let type = passwordSTA.getAttribute("type") === "password" ? "text" : "password"
      passwordSTA.setAttribute("type", type);
      // know the type
      bToggleSTA = type === "text" ? true : false;     
      // toggle the eye slash icon
      this.classList.toggle("fa-eye-slash");
   }  // end function
);    // end listener

</script>

</body></html>
